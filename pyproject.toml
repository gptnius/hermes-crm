[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-crm"
version = "0.1.0"
description = "A profile-local, agent-native CRM for Hermes"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
hermes-crm = "hermes_crm.web:main"

[tool.setuptools.packages.find]
include = ["hermes_crm*"]

[tool.setuptools.package-data]
hermes_crm = ["static/*"]
