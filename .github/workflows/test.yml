name: Credential-free contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: crm_ci
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check '.[test,postgres]'
      - name: Install React fixture dependencies without lifecycle scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/hermes-crm-react"
          --ignore-scripts --no-audit --no-fund
          react@19.3.0 react-test-renderer@19.3.0
      - name: Verify generated sources
        run: python scripts/ci_checks.py --suite generated
      - name: Run Python SQLite and disposable PostgreSQL contracts
        run: >-
          python scripts/ci_checks.py --suite python
          --postgres-url 'postgresql+psycopg://crm_ci:disposable-ci-only@127.0.0.1:5432/crm_ci'
      - name: Run JavaScript and React contract fixtures
        run: >-
          python scripts/ci_checks.py --suite javascript
          --react-root "$RUNNER_TEMP/hermes-crm-react"
